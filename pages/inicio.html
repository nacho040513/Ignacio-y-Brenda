        <span class="home-photo-card__heart material-symbols-outlined" aria-hidden="true">favorite</span>

        <span class="home-photo-card__hint">Toca para volver a la foto</span>
      </span>
    </button>
  </figure>

<script>
const photoCard = document.querySelector('.home-photo-card');
photoCard?.addEventListener('click', () => {
  const isFlipped = photoCard.getAttribute('aria-pressed') !== 'true';
  photoCard.setAttribute('aria-pressed', String(isFlipped));
  photoCard.setAttribute('aria-label', isFlipped ? 'Volver a mostrar la foto' : 'Mostrar el mensaje detrás de la foto');
  photoCard.querySelector('.home-photo-card__front').setAttribute('aria-hidden', String(isFlipped));
  photoCard.querySelector('.home-photo-card__back').setAttribute('aria-hidden', String(!isFlipped));
});
</script>
